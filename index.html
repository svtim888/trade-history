  document.open();document.write(new TextDecoder().decode(pt));document.close();}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{let s=null;try{s=localStorage.getItem("th_key")}catch(e){}
  if(s){try{await open_(await crypto.subtle.importKey("raw",ub(s),"AES-GCM",false,["decrypt"]));return}catch(e){try{localStorage.removeItem("th_key")}catch(e){}}}
  document.getElementById("f").hidden=false;})();
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const err=document.getElementById("err");err.textContent="กำลังเปิด…";
  try{const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    const raw=await crypto.subtle.exportKey("raw",k),rm=document.getElementById("rm").checked;  // read before the page is replaced
    await open_(k);if(rm){try{localStorage.setItem("th_key",bu(raw))}catch(e){}}
  }catch(x){err.textContent="รหัสผิด";}};
