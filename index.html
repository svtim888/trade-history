<style>:root{--bg:#f6f7f9;--fg:#1d2330;--mut:#6b7280;--card:#fff;--line:#e5e7eb;--neg:#c62828;--acc:#3730a3}
@media (prefers-color-scheme:dark){:root{--bg:#11141a;--fg:#e6e8ec;--mut:#9aa3af;--card:#1a1f27;--line:#2a313c;--neg:#f87171;--acc:#818cf8}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(320px,calc(100vw - 32px));box-sizing:border-box}
h1{font-size:18px;margin:0 0 14px}input[type=password]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut);margin:10px 0 14px}
button{width:100%;font:inherit;padding:9px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}#err{color:var(--neg);font-size:13px;min-height:18px;margin-top:8px}</style></head>
